name: Azure destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to delete every resource in the resource group except the deploy identity
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Delete everything except the deploy identity
        run: |
          az deployment group create --name destroy --mode Complete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file deploy/azure/destroy.bicep
      - name: Purge the soft-deleted Key Vault
        # The vault name is deterministic (uniqueString of group + environment), so a re-apply
        # within the 90-day soft-delete window collides unless the deleted vault is purged.
        # Purge is a subscription-scoped action the group-scoped Contributor may lack — if this
        # step fails, run the printed command once in Cloud Shell instead.
        run: |
          set -euo pipefail
          rg="${{ vars.AZURE_RESOURCE_GROUP }}"
          for vault in $(az keyvault list-deleted \
              --query "[?contains(properties.vaultId, '/resourceGroups/${rg}/')].name" -o tsv); do
            az keyvault purge --name "$vault" \
              || echo "::warning::Purge denied — run in Cloud Shell: az keyvault purge --name $vault"
          done
