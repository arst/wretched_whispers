name: .NET Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies
        run: dotnet restore wretched-whispers-server/WretchedWhispers.sln
      - name: Build
        run: dotnet build wretched-whispers-server/WretchedWhispers.sln --no-restore --configuration Release
      - name: Test
        # Whole solution: includes the Evals project's deterministic tests (harness + evaluators);
        # live LLM evals skip cleanly when no Azure OpenAI credentials are configured.
        run: dotnet test wretched-whispers-server/WretchedWhispers.sln --no-build --configuration Release --logger "trx"
