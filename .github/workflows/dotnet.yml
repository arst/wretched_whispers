name: .NET Build and Test

permissions:
  contents: read

# Supersede in-flight runs on PR updates; never cancel main pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wretched_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wretched_tests"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      WW_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=wretched_tests;Username=postgres;Password=postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore wretched-whispers-server/WretchedWhispers.slnx
      - name: Verify formatting
        run: dotnet format wretched-whispers-server/WretchedWhispers.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build wretched-whispers-server/WretchedWhispers.slnx --no-restore --configuration Release
      - name: Test
        # Whole solution: includes the Evals project's deterministic tests (harness + evaluators);
        # live LLM evals skip cleanly when no Azure OpenAI credentials are configured.
        run: dotnet test --solution wretched-whispers-server/WretchedWhispers.slnx --no-build --configuration Release
      - name: Check migrations match the model
        # Model changes need dual migrations (SQLite + Postgres); this fails when either
        # context has drifted from its latest migration.
        working-directory: wretched-whispers-server
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project WretchedWhispers.Infrastructure --context WretchedWhispersDbContext
          dotnet ef migrations has-pending-model-changes --project WretchedWhispers.Infrastructure --context PostgresWwDbContext
      - name: Compile deployment profiles
        run: |
          dotnet build wretched-whispers-server/WretchedWhispers.Api/WretchedWhispers.Api.csproj --configuration Release -p:DeploymentProfile=Server
          dotnet build wretched-whispers-server/WretchedWhispers.Api/WretchedWhispers.Api.csproj --configuration Release -p:DeploymentProfile=StandaloneContainer
          dotnet build wretched-whispers-server/WretchedWhispers.Api/WretchedWhispers.Api.csproj --configuration Release -p:DeploymentProfile=Desktop
