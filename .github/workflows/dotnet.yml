name: .NET Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wretched_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wretched_tests"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      WW_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=wretched_tests;Username=postgres;Password=postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies
        run: dotnet restore wretched-whispers-server/WretchedWhispers.slnx
      - name: Verify formatting
        run: dotnet format wretched-whispers-server/WretchedWhispers.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build wretched-whispers-server/WretchedWhispers.slnx --no-restore --configuration Release
      - name: Test
        # Whole solution: includes the Evals project's deterministic tests (harness + evaluators);
        # live LLM evals skip cleanly when no Azure OpenAI credentials are configured.
        run: dotnet test wretched-whispers-server/WretchedWhispers.slnx --no-build --configuration Release --logger "trx"
      - name: Compile deployment profiles
        run: |
          dotnet build wretched-whispers-server/WretchedWhispers.Api/WretchedWhispers.Api.csproj --configuration Release -p:DeploymentProfile=Server
          dotnet build wretched-whispers-server/WretchedWhispers.Api/WretchedWhispers.Api.csproj --configuration Release -p:DeploymentProfile=StandaloneContainer
          dotnet build wretched-whispers-server/WretchedWhispers.Api/WretchedWhispers.Api.csproj --configuration Release -p:DeploymentProfile=Desktop
