name: Azure infrastructure

on:
  pull_request:
    branches: [main]
    paths:
      - deploy/azure/**
      - .github/workflows/azure-infra.yml
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to perform
        type: choice
        options: [what-if, apply, bootstrap]
        required: true

permissions:
  contents: read
  id-token: write

env:
  DEPLOYMENT_NAME: wretched-whispers

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: az bicep build --file deploy/azure/main.bicep

  what-if:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'what-if'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Production what-if
        run: |
          az deployment group what-if --name "$DEPLOYMENT_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file deploy/azure/main.bicep \
            --parameters environmentName="${{ vars.AZURE_ENVIRONMENT_NAME }}" \
              location="${{ vars.AZURE_LOCATION }}" \
              deploymentPrincipalObjectId="${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}" \
              postgresAdministratorPassword='NotUsed-By-WhatIf-Only-42!' \
              azureOpenAiEndpoint="${{ vars.AZURE_OPENAI_ENDPOINT }}" \
              azureOpenAiDeployment="${{ vars.AZURE_OPENAI_DEPLOYMENT }}" \
              deployWorkloads=false deployApplication=false

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'what-if'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply stable infrastructure
        run: |
          az deployment group create --name "$DEPLOYMENT_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file deploy/azure/main.bicep \
            --parameters environmentName="${{ vars.AZURE_ENVIRONMENT_NAME }}" \
              location="${{ vars.AZURE_LOCATION }}" \
              deploymentPrincipalObjectId="${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}" \
              postgresAdministratorPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
              azureOpenAiEndpoint="${{ vars.AZURE_OPENAI_ENDPOINT }}" \
              azureOpenAiDeployment="${{ vars.AZURE_OPENAI_DEPLOYMENT }}" \
              deployWorkloads=false deployApplication=false
      - name: Bootstrap database roles and Key Vault secrets
        if: inputs.operation == 'bootstrap'
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ADMIN_LOGIN: wwadmin
          ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
        run: |
          set -euo pipefail
          server=$(az deployment group show -g "$RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query properties.outputs.postgresServerName.value -o tsv)
          host=$(az deployment group show -g "$RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query properties.outputs.postgresHost.value -o tsv)
          database=$(az deployment group show -g "$RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query properties.outputs.databaseName.value -o tsv)
          vault=$(az deployment group show -g "$RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query properties.outputs.keyVaultName.value -o tsv)
          runner_ip=$(curl -fsS https://api.ipify.org)
          cleanup() { az postgres flexible-server firewall-rule delete -g "$RESOURCE_GROUP" -n "$server" -r GitHubBootstrap --yes >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          az postgres flexible-server firewall-rule create -g "$RESOURCE_GROUP" -n "$server" \
            -r GitHubBootstrap --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" >/dev/null
          app_password=$(openssl rand -hex 32)
          migrator_password=$(openssl rand -hex 32)
          PGPASSWORD="$ADMIN_PASSWORD" psql "host=$host dbname=$database user=$ADMIN_LOGIN sslmode=require" \
            -v database_name="$database" -v app_password="$app_password" \
            -v migrator_password="$migrator_password" -f deploy/azure/bootstrap-database.sql
          az keyvault secret set --vault-name "$vault" --name app-db-connection \
            --value "Host=$host;Port=5432;Database=$database;Username=ww_app;Password=$app_password;SSL Mode=Require" >/dev/null
          az keyvault secret set --vault-name "$vault" --name migration-db-connection \
            --value "Host=$host;Port=5432;Database=$database;Username=ww_migrator;Password=$migrator_password;SSL Mode=Require" >/dev/null
          az keyvault secret set --vault-name "$vault" --name azure-openai-key \
            --value "$AZURE_OPENAI_KEY" >/dev/null
      - name: Provision migration job
        if: inputs.operation == 'bootstrap'
        run: |
          az deployment group create --name "$DEPLOYMENT_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file deploy/azure/main.bicep \
            --parameters environmentName="${{ vars.AZURE_ENVIRONMENT_NAME }}" \
              location="${{ vars.AZURE_LOCATION }}" \
              deploymentPrincipalObjectId="${{ vars.AZURE_PRINCIPAL_OBJECT_ID }}" \
              postgresAdministratorPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
              azureOpenAiEndpoint="${{ vars.AZURE_OPENAI_ENDPOINT }}" \
              azureOpenAiDeployment="${{ vars.AZURE_OPENAI_DEPLOYMENT }}" \
              deployWorkloads=true deployApplication=false
