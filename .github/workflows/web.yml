name: Web Build and Test

on:
  push:
    branches: [main]
    paths:
      - "wretched-whispers-web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "wretched-whispers-web/**"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wretched-whispers-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wretched-whispers-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5007
      - run: npm run build
        env:
          NEXT_PUBLIC_DEPLOYMENT_PROFILE: Server
          NEXT_PUBLIC_API_URL: ""
      - run: npm run build
        env:
          NEXT_PUBLIC_DEPLOYMENT_PROFILE: StandaloneContainer
          NEXT_PUBLIC_API_URL: ""
