name: Server image

# The hosted deployment lives in a private ops repository, which holds the Azure credentials and
# never checks out this source. It consumes what this workflow publishes: one immutable
# Server-profile image per commit, which it imports into ACR and rolls out. Tagging by commit SHA
# alone is deliberate — a moving tag would leave the container app's image string unchanged, and an
# unchanged template produces no new revision.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: DEPLOYMENT_PROFILE=Server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wretched-whispers-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
