name: Deploy Server

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DEPLOYMENT_NAME: wretched-whispers

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push immutable image
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          registry=$(az deployment group show -g "$RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query properties.outputs.registryName.value -o tsv)
          login_server=$(az deployment group show -g "$RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query properties.outputs.registryLoginServer.value -o tsv)
          az acr login --name "$registry"
          image="$login_server/wretched-whispers:${GITHUB_SHA}"
          docker build --build-arg DEPLOYMENT_PROFILE=Server -t "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Migrate, roll out, and verify
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          app=$(az deployment group show -g "$RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query properties.outputs.containerAppName.value -o tsv)
          job=$(az deployment group show -g "$RESOURCE_GROUP" -n "$DEPLOYMENT_NAME" --query properties.outputs.migrationJobName.value -o tsv)

          az containerapp job update -g "$RESOURCE_GROUP" -n "$job" --image "$IMAGE" >/dev/null
          execution=$(az containerapp job start -g "$RESOURCE_GROUP" -n "$job" --query name -o tsv)
          for attempt in {1..90}; do
            status=$(az containerapp job execution show -g "$RESOURCE_GROUP" -n "$job" \
              --job-execution-name "$execution" --query properties.status -o tsv)
            case "$status" in
              Succeeded) break ;;
              Failed|Stopped) echo "Migration execution $execution ended with $status"; exit 1 ;;
            esac
            sleep 10
          done
          test "$status" = Succeeded

          # Single-revision mode: the update below does the rollout natively — new revision, health
          # gate, traffic cutover, old revision deactivated. Deactivation matters here: TurnWorker
          # polls a shared queue from every live replica, so a lingering old revision (as blue/green
          # keeps for rollback) would keep claiming turns with outdated code. Rollback is redeploying
          # the previous immutable SHA-tagged image.
          if ! az containerapp show -g "$RESOURCE_GROUP" -n "$app" >/dev/null 2>&1; then
            az deployment group create --name "$DEPLOYMENT_NAME" -g "$RESOURCE_GROUP" \
              --template-file deploy/azure/main.bicep \
              --parameters environmentName="${{ vars.AZURE_ENVIRONMENT_NAME }}" \
                location="${{ vars.AZURE_LOCATION }}" \
                deploymentPrincipalObjectId="${{ secrets.AZURE_PRINCIPAL_OBJECT_ID }}" \
                postgresAdministratorPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
                azureOpenAiEndpoint="${{ vars.AZURE_OPENAI_ENDPOINT }}" \
                azureOpenAiDeployment="${{ vars.AZURE_OPENAI_DEPLOYMENT }}" \
                image="$IMAGE" deployWorkloads=true deployApplication=true >/dev/null
          else
            # set-mode is idempotent and migrates an app created before the Single-mode template.
            az containerapp revision set-mode -g "$RESOURCE_GROUP" -n "$app" --mode single >/dev/null
            az containerapp update -g "$RESOURCE_GROUP" -n "$app" --image "$IMAGE" >/dev/null
          fi

          for attempt in {1..60}; do
            latest=$(az containerapp show -g "$RESOURCE_GROUP" -n "$app" --query properties.latestRevisionName -o tsv)
            ready=$(az containerapp show -g "$RESOURCE_GROUP" -n "$app" --query properties.latestReadyRevisionName -o tsv)
            [ "$latest" = "$ready" ] && break
            sleep 5
          done
          test "$latest" = "$ready"

          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$app" --query properties.configuration.ingress.fqdn -o tsv)
          scripts/verify-server-revision.sh "https://$fqdn"
