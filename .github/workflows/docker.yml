name: Docker Publish

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight verify runs on PR updates; tag/dispatch publishes are never canceled
# (each tag is its own ref, and cancel-in-progress is false outside pull_request).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build container profiles
        run: |
          docker build --build-arg DEPLOYMENT_PROFILE=Server -t wretched-whispers:server .
          docker build --build-arg DEPLOYMENT_PROFILE=StandaloneContainer -t wretched-whispers:standalone .
      - name: Smoke Server image
        run: |
          docker network create wretched-whispers-smoke
          docker run -d --name postgres --network wretched-whispers-smoke \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=wretched postgres:17-alpine
          for attempt in {1..30}; do docker logs postgres 2>&1 | grep -q 'PostgreSQL init process complete' && break; sleep 1; done
          docker exec postgres pg_isready -U postgres
          docker exec -i postgres psql -U postgres -d wretched \
            -v database_name=wretched -v app_password=smokeapp -v migrator_password=smokemigrator \
            < deploy/postgres-roles.sql
          migration_connection='Host=postgres;Port=5432;Database=wretched;Username=ww_migrator;Password=smokemigrator'
          app_connection='Host=postgres;Port=5432;Database=wretched;Username=ww_app;Password=smokeapp'
          docker run --rm --network wretched-whispers-smoke \
            -e WW_DB_PROVIDER=postgres -e WW_DB_CONNECTION="$migration_connection" \
            --entrypoint dotnet wretched-whispers:server WretchedWhispers.Migrations.dll
          docker run -d --name wretched-whispers-server --network wretched-whispers-smoke -p 8080:8080 \
            -e WW_DB_PROVIDER=postgres -e WW_DB_CONNECTION="$app_connection" wretched-whispers:server
          for attempt in {1..30}; do curl -fsS http://localhost:8080/health/ready && break; sleep 1; done
          curl -fsS http://localhost:8080/health/live
          curl -fsS http://localhost:8080/
          curl -fsSL http://localhost:8080/sessions
          curl -fsS -X POST http://localhost:8080/api/auth/register -H 'Content-Type: application/json' -d '{"email":"smoke@example.com","password":"password"}'
          token=$(curl -fsS -X POST 'http://localhost:8080/api/auth/login?useCookies=false' -H 'Content-Type: application/json' -d '{"email":"smoke@example.com","password":"password"}' | jq -r .accessToken)
          curl -fsS http://localhost:8080/api/sessions -H "Authorization: Bearer $token"
      - name: Previous Server commit accepts the expanded schema
        run: |
          git worktree add /tmp/wretched-whispers-previous "${{ github.event.pull_request.base.sha }}"
          docker build --build-arg DEPLOYMENT_PROFILE=Server \
            -t wretched-whispers:previous /tmp/wretched-whispers-previous
          migration_connection='Host=postgres;Port=5432;Database=wretched;Username=ww_migrator;Password=smokemigrator'
          docker run -d --name wretched-whispers-previous --network wretched-whispers-smoke -p 8081:8080 \
            -e WW_DB_PROVIDER=postgres -e ConnectionStrings__Default="$migration_connection" wretched-whispers:previous
          for attempt in {1..30}; do curl -fsS http://localhost:8081/health && break; sleep 1; done
          curl -fsS -X POST http://localhost:8081/api/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"previous@example.com","password":"password"}'
          token=$(curl -fsS -X POST 'http://localhost:8081/api/auth/login?useCookies=false' \
            -H 'Content-Type: application/json' -d '{"email":"previous@example.com","password":"password"}' | jq -r .accessToken)
          curl -fsS http://localhost:8081/api/sessions -H "Authorization: Bearer $token"

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/wretched-whispers
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
